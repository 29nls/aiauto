name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Documented support range (README: Python 3.10+). Pinned deps have
        # wheels for every entry (verified Requires-Python + wheel resolution).
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Build package wheel
        # Guards invalid pyproject.toml / broken packaging in CI: the
        # installable-package claim (T4) is otherwise only validated textually
        # by the drift-guard test. --no-deps keeps this fast; artifacts go to
        # the runner temp dir, never the workspace.
        run: python -m pip wheel . --no-deps -w $env:RUNNER_TEMP\wheels
      - name: Compile Python modules
        run: python -m compileall -q dn_bot tests
      - name: Run offline tests
        run: python -m pytest -q tests
      - name: Verify clean working tree
        # GitHub runners are ephemeral, so a cache-cleanup step (rm -rf
        # __pycache__) would be a no-op — nothing persists across runs. This
        # gate is the real prevention: it fails the job if any step generates
        # an artifact that is NOT gitignored, so future tooling cannot
        # silently litter the repo with dead files. Everything this job
        # produces (__pycache__, .pytest_cache, build/, *.egg-info) is already
        # covered by .gitignore.
        run: |
          $dirty = git status --porcelain
          if ($dirty) {
            Write-Error "Artefak tak ter-ignore terdeteksi di working tree:`n$dirty"
            exit 1
          }
